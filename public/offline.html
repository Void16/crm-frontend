<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Bhungane CRM</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #333;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }
    img {
      width: 120px;
      margin-bottom: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="/bi192.png" alt="CRM Logo" />
    <h1>You’re Offline</h1>
    <p>No internet connection detected.</p>
    <p>Please reconnect and try again.</p>
  </div>
</body>
</html>
